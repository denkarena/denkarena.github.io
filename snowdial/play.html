<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Snowdial</title>

<style>
@font-face{font-family:"Fredoka";src:url(fonts/fredoka_semibold.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Fredoka";src:url(fonts/fredoka_bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Nunito";src:url(fonts/nunito_bold.woff2) format("woff2");font-weight:400 700;font-display:swap}
@font-face{font-family:"Nunito";src:url(fonts/nunito_extrabold.woff2) format("woff2");font-weight:800 900;font-display:swap}
#tDaily,#lDaily{display:none!important}
.probe-end{background:#FFF4D6;border-radius:18px;padding:12px 14px;margin:0 0 12px;font-weight:800;text-align:center;line-height:1.35}

/* Layout: one-screen game over a painted summer sky - top bar, day track, island board, tool bubbles.
   Deliberately a single look (summer diorama), so every colour is set explicitly. */
:root {
  --ink: #263449;
  --ink-soft: #64748B;
  --cream: #FFFBF2;
  --orange: #FF8A3D; --orange-l: #FFAA5C; --orange-d: #D9611F;
  --blue: #3FA2EA; --blue-l: #6BBDF5; --blue-d: #2373B8;
  --green: #4FB955; --green-l: #74D06F; --green-d: #2F8C3B;
  --gold: #FFC53D; --gold-l: #FFE07A; --gold-d: #E0930F;
  --grey: #C3CCD6; --grey-l: #D5DCE4; --grey-d: #A2ADBA;
  --heat: #FF5A2A;
  --scrim: rgba(20, 32, 54, 0.6);
  --font-display: "Fredoka", "Nunito", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: #8ED2FF;
  color: var(--ink);
  font-family: var(--font-body);
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: max(14px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
.app { position: relative; z-index: 1; height: 100%; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; padding-block: 10px; }
.panel { background: linear-gradient(#fff, var(--cream)); border: 2px solid #fff; border-radius: 22px; box-shadow: 0 6px 16px rgba(27, 42, 68, 0.16); }
.top { display: flex; align-items: center; gap: 8px; }
.titles { flex: 1; min-width: 0; }
.world { font: 900 0.72rem/1 var(--font-body); letter-spacing: 0.1em; color: var(--ink-soft); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lvl { font: 700 1.35rem/1.1 var(--font-display); text-shadow: 0 2px 0 #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { background: linear-gradient(#fff, var(--cream)); border-radius: 16px; box-shadow: 0 3px 8px rgba(27, 42, 68, 0.15); }
.moves { padding: 3px 10px; text-align: center; min-width: 46px; }
.moves b { display: block; font: 700 1.15rem/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.moves small { display: block; font: 900 0.62rem/1 var(--font-body); color: var(--gold-d); }
.flakes { display: flex; gap: 2px; padding: 6px 7px; border-radius: 999px; }
.flakes canvas { width: 24px; height: 24px; }
.sun { padding: 8px 12px; display: grid; gap: 6px; }
.sun .line { display: flex; align-items: center; gap: 8px; min-width: 0; }
#sunIcon { width: 30px; height: 30px; flex: none; }
.sun .ph { font: 600 1.15rem/1 var(--font-display); }
.sun .sub { font: 800 0.8rem/1.2 var(--font-body); color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#strip { width: 100%; height: 30px; display: block; touch-action: none; cursor: pointer; }
.note { display: flex; gap: 8px; align-items: center; background: #FFF1C7; border: 2px solid var(--gold); border-radius: 14px; padding: 6px 10px; font: 800 0.88rem/1.25 var(--font-body); }
.stage { flex: 1; min-height: 0; position: relative; }
#board { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.hot { position: absolute; left: 50%; top: 6px; transform: translateX(-50%); background: linear-gradient(#FF8A4D, var(--heat)); color: #fff; border-radius: 16px; padding: 6px 18px; font: 600 1.05rem/1 var(--font-display); text-shadow: 0 2px 0 var(--orange-d); transition: opacity 0.35s; pointer-events: none; }
.peek { position: absolute; left: 50%; top: 6px; transform: translateX(-50%); background: rgba(38, 52, 73, 0.88); color: #fff; border-radius: 14px; padding: 7px 16px; font: 600 1rem/1 var(--font-display); pointer-events: none; }
.tools { display: flex; justify-content: space-evenly; padding-bottom: 4px; }
.tool { border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font: 900 0.74rem/1 var(--font-body); color: var(--ink); position: relative; }
.bubble { --l: #fff; --b: var(--cream); --d: #D9CCB4; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(var(--l), var(--b)); border: 1.5px solid rgba(255, 255, 255, 0.6); box-shadow: 0 4px 0 var(--d), 0 7px 12px rgba(27, 42, 68, 0.22); transition: transform 0.08s, box-shadow 0.08s; }
.tool:active .bubble { transform: translateY(3px); box-shadow: 0 1px 0 var(--d), 0 3px 6px rgba(27, 42, 68, 0.2); }
.bubble svg { width: 26px; height: 26px; }
.tool[disabled] { color: #A2ADBA; cursor: default; }
.tool[disabled] .bubble { --l: var(--grey-l); --b: var(--grey); --d: var(--grey-d); color: #fff; }
.bubble.blue { --l: var(--blue-l); --b: var(--blue); --d: var(--blue-d); color: #fff; }
.bubble.gold { --l: var(--gold-l); --b: var(--gold); --d: var(--gold-d); }
.badge { position: absolute; top: -5px; right: -12px; background: var(--ink); color: #fff; border-radius: 10px; padding: 2px 6px; font: 900 0.66rem/1 var(--font-body); }
.candy { --l: var(--orange-l); --b: var(--orange); --d: var(--orange-d); border: 1.5px solid rgba(255, 255, 255, 0.35); border-radius: 22px; padding: 14px 16px; width: 100%; cursor: pointer; font: 600 1.25rem/1 var(--font-display); color: #fff; text-shadow: 0 3px 0 var(--d); background: linear-gradient(var(--l), var(--b)); box-shadow: 0 5px 0 var(--d), 0 9px 16px rgba(27, 42, 68, 0.2); position: relative; transition: transform 0.08s, box-shadow 0.08s; display: flex; align-items: center; justify-content: center; gap: 10px; }
.candy::before { content: ""; position: absolute; left: 18px; right: 18px; top: 6px; height: 26%; border-radius: 999px; background: rgba(255, 255, 255, 0.28); }
.candy:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--d), 0 4px 8px rgba(27, 42, 68, 0.2); }
.candy.blue { --l: var(--blue-l); --b: var(--blue); --d: var(--blue-d); }
.candy.green { --l: var(--green-l); --b: var(--green); --d: var(--green-d); }
.candy.small { font-size: 1.05rem; padding: 12px; }
.candy.berry { --l: #B98BFA; --b: #9B63F0; --d: #6E3FC4; }
.candy.cream { --l: #fff; --b: var(--cream); --d: #D9CCB4; color: var(--ink); text-shadow: none; }
details.world-block summary { list-style: none; cursor: pointer; }
details.world-block summary::-webkit-details-marker { display: none; }
details.world-block summary h3 { display: flex; justify-content: space-between; align-items: center; }
details.world-block summary h3::after { content: "▾"; font-size: 0.9rem; color: var(--ink-soft); }
details.world-block[open] summary h3::after { content: "▴"; }
.world-block h3 small { font: 800 0.8rem/1 var(--font-body); color: var(--ink-soft); margin-left: auto; margin-right: 8px; }
.chip svg { vertical-align: -5px; }
.candy:focus-visible, .tool:focus-visible, .lv:focus-visible, .chip:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
.overlay { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: grid; place-items: center; padding: max(30px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dialog { position: relative; width: min(420px, 100%); max-height: 100%; display: flex; flex-direction: column; }
.dialog .panel { padding: 46px 20px 20px; text-align: center; display: flex; flex-direction: column; gap: 12px; overflow: auto; max-height: calc(100vh - 80px); border-radius: 30px; }
.dialog.plain .panel { padding-top: 22px; }
.ribbon { position: absolute; left: 50%; top: -24px; transform: translateX(-50%); z-index: 2; height: 56px; min-width: 220px; display: grid; place-items: center; padding: 0 50px 8px; font: 600 1.45rem/1 var(--font-display); color: #fff; text-shadow: 0 3px 0 var(--rd); white-space: nowrap; --rb: var(--green); --rd: var(--green-d); }
.ribbon svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }
.ribbon.orange { --rb: var(--orange); --rd: var(--orange-d); }
.ribbon.blue { --rb: var(--blue); --rd: var(--blue-d); }
.dialog h2 { margin: 0; font: 600 1.4rem/1.2 var(--font-display); text-wrap: balance; }
.dialog p { margin: 0; font: 700 0.98rem/1.4 var(--font-body); color: var(--ink-soft); }
.stars { display: flex; justify-content: center; align-items: flex-end; gap: 4px; }
.goals { background: #F4EEE2; border-radius: 18px; padding: 8px 14px; display: grid; gap: 6px; text-align: left; font: 800 0.92rem/1.3 var(--font-body); }
.goals div { display: flex; align-items: center; gap: 8px; }
.goals .off { color: var(--ink-soft); }
.goals .ok { margin-left: auto; color: var(--green); font-weight: 900; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.world-block { text-align: left; display: grid; gap: 8px; }
.world-block h3 { margin: 6px 0 0; font: 600 1.15rem/1 var(--font-display); }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.lv { border: 0; border-radius: 14px; padding: 7px 0 5px; cursor: pointer; display: grid; gap: 3px; justify-items: center; font: 700 1.05rem/1 var(--font-display); color: #fff; text-shadow: 0 2px 0 rgba(38, 52, 73, 0.45); background: linear-gradient(var(--tile-a), var(--tile-b)); box-shadow: 0 4px 0 var(--tile-d); }
.lv small { font-size: 0.62rem; color: var(--gold-l); min-height: 0.7rem; letter-spacing: 0.04em; text-shadow: none; }
.lv.cur { outline: 3px solid var(--gold); outline-offset: 2px; }
.chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.chip { border: 0; background: #F1EAD9; color: var(--ink); border-radius: 999px; padding: 9px 14px; font: 900 0.86rem/1 var(--font-body); cursor: pointer; }
.tutor { display: flex; gap: 10px; align-items: center; text-align: left; font: 700 0.98rem/1.4 var(--font-body); color: var(--ink); }
.tutor canvas { width: 62px; height: 78px; flex: none; }
#tutor { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; padding: 6px; }
#tutor .candy { margin-top: 12px; }
#titleScreen { position: fixed; inset: 0; z-index: 15; display: flex; flex-direction: column; align-items: center; padding: 16px max(22px, env(safe-area-inset-right, 0px)) 22px max(22px, env(safe-area-inset-left, 0px)); max-width: 520px; margin: 0 auto; }
#titleScreen svg.logo { width: min(320px, 82vw); height: auto; margin-top: 5vh; }
#titleScreen .tag { font: 600 1.15rem/1.2 var(--font-display); text-shadow: 0 2px 0 #fff; margin-top: -2px; }
#hero { flex: 1; width: 100%; min-height: 150px; }
#titleScreen .actions { width: 100%; display: grid; gap: 14px; }
@media (prefers-reduced-motion: reduce) { .candy:active, .tool:active .bubble { transform: none; } }

<canvas id="sky"></canvas>

<div class="app" id="app">

    <div class="titles"><div class="world" id="worldName">Garden</div><div class="lvl" id="title">Level 1-1</div></div>
    <div class="moves pill"><b id="moves">0</b><small id="par">★ 7</small></div>
    <div class="flakes pill" id="flakes"></div>
  </div>
  <div class="sun panel">
    <div class="line"><canvas id="sunIcon" width="60" height="60"></canvas><span class="ph" id="phName">Morning</span><span class="sub" id="phSub"></span></div>
    <canvas id="strip"></canvas>
    <div class="note" id="note" hidden><svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="9.5" r="7" fill="#FFC53D" stroke="#263449" stroke-width="2"/><rect x="8.5" y="17.5" width="7" height="4" rx="1.4" fill="#263449"/></svg><span id="noteText"></span></div>
  </div>
  <div class="stage">
    <canvas id="board"></canvas>
    <div class="hot" id="hot" style="opacity:0">Too hot!</div>
    <div class="peek" id="peek" hidden></div>
    <div id="tutor" hidden><div class="panel" style="padding:14px"><div class="tutor"><canvas id="tutorAvatar" width="124" height="156"></canvas><span id="tutorText"></span></div><button class="candy green small" id="tutorOk">Got it</button></div></div>
  </div>
  <div class="tools">

    <button class="tool" id="hint"><span class="bubble gold"><svg viewBox="0 0 24 24"><circle cx="12" cy="9.5" r="7" fill="#FFE07A" stroke="#263449" stroke-width="2.2"/><circle cx="12" cy="10" r="4.6" fill="#FFC53D"/><rect x="8.4" y="17.5" width="7.2" height="4.2" rx="1.4" fill="#263449"/></svg></span>Hint<span class="badge">free</span></button>
  </div>
</div>

<div id="titleScreen">
  <svg class="logo" viewBox="0 0 320 110" aria-label="Snowdial">
    <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="0.55" stop-color="#D7EEFF"/><stop offset="1" stop-color="#8FCBF5"/></linearGradient></defs>
    <text x="160" y="92" text-anchor="middle" font-family="Fredoka, Nunito, sans-serif" font-weight="700" font-size="72" fill="#263449" stroke="#263449" stroke-width="13" stroke-linejoin="round" transform="translate(0 5)">Snowdial</text>
    <text x="160" y="92" text-anchor="middle" font-family="Fredoka, Nunito, sans-serif" font-weight="700" font-size="72" fill="url(#lg)" stroke="#263449" stroke-width="13" stroke-linejoin="round" paint-order="stroke">Snowdial</text>
  </svg>
  <div class="tag">Stay cool. Stay in the shade.</div>
  <canvas id="hero"></canvas>
  <div class="actions">
    <button class="candy" id="tPlay" style="font-size:1.5rem;padding:18px"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M7 4.5l13 7.5-13 7.5z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg><span id="tPlayText">Play</span></button>
    <div class="row2"><button class="candy blue small" id="tLevels">Levels</button><button class="candy green small" id="tDaily">Daily puzzle</button></div>
  </div>
</div>

<div class="overlay" id="ov" hidden><div class="dialog" id="dlg"></div></div>

// ================================================================ rules (port of engine/Board.kt, v2)
// The sun rises on the left (morning: shadows fall right), stands high at noon (short shadows
// falling down) and sets on the right (evening: shadows fall left). Night: shade everywhere.
const PHASES = {
  R: { dx: 1, dy: 0, name: "Morning", color: "#FFA24D", ang: 0 },
  Z: { dx: 0, dy: 1, name: "Noon", color: "#FFD447", ang: 90, noon: true },
  S: { dx: -1, dy: 0, name: "Evening", color: "#FF7A90", ang: 180 },
  N: { dx: 0, dy: 0, name: "Night", color: "#3E4C8F", night: true },
};
const shadowLen = (ph, h) => (PHASES[ph].night ? 0 : PHASES[ph].noon ? (h + 1) >> 1 : h);
const TER = {
  ".": { h: 0, walk: true, crate: true }, b: { h: 1 }, r: { h: 1 }, t: { h: 2 }, h: { h: 3 },
  "~": { h: 0 }, i: { h: 0, walk: true, crate: true, ice: true }, p: { h: 0, walk: true, always: true },
  g: { h: 0, grill: true }, O: { h: 0, walk: true, always: true, igloo: true },
  _: { h: 0, walk: true, sw: true }, "#": { h: 2, gate: true }, "@": { h: 0, walk: true, portal: true },
  "^": { h: 0, walk: true, crate: true, wind: [0, -1] }, v: { h: 0, walk: true, crate: true, wind: [0, 1] },
  "<": { h: 0, walk: true, crate: true, wind: [-1, 0] }, ">": { h: 0, walk: true, crate: true, wind: [1, 0] },
};
const DIRS = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0], W: [0, 0] };
const gcd = (a, b) => (b ? gcd(b, a % b) : a);
const mod = (a, n) => ((a % n) + n) % n;

function parseLevel(line) {
  const f = {};
  for (const part of line.split(";")) { const i = part.indexOf("="); if (i > 0) f[part.slice(0, i)] = part.slice(i + 1); }
  const w = +f.w, h = +f.h;
  const cell = (s) => { const [x, y] = s.split(",").map(Number); return y * w + x; };
  const list = (k) => (f[k] ? f[k].split(" ").filter(Boolean).map(cell) : []);
  const sched = [];
  for (let i = 0; i < f.sun.length; i += 2) sched.push({ ph: f.sun[i], moves: +f.sun[i + 1] });
  return {
    w, h, terr: f.map.split("/").join("").split(""), sched, start: cell(f.start),
    flakes: list("flakes"), crates: list("crates"), portals: list("portals"),
    buddy: f.buddy ? cell(f.buddy) : -1, gatesOpen: f.gates === "open",
    clouds: f.clouds ? f.clouds.split(" ").map((c) => { const p = c.split(",").map(Number); return { x: p[0], y: p[1], w: p[2], h: p[3], dx: p[4], dy: p[5] }; }) : [],
    par: +(f.par || 0), rating: +(f.rating || 0),
  };
}

class Board {
  constructor(L) {
    this.L = L; const w = (this.w = L.w), h = (this.h = L.h), n = (this.n = w * h);
    this.igloo = L.terr.indexOf("O");
    this.T = L.terr.map((c) => TER[c]);
    this.flakeAt = new Array(n).fill(-1); L.flakes.forEach((c, i) => (this.flakeAt[c] = i));
    this.allMask = (1 << L.flakes.length) - 1;
    this.partner = new Array(n).fill(-1); this.pairOf = new Array(n).fill(-1);
    for (let k = 0; k < L.portals.length; k += 2) { const a = L.portals[k], b = L.portals[k + 1]; this.partner[a] = b; this.partner[b] = a; this.pairOf[a] = this.pairOf[b] = k / 2; }
    this.hasGates = this.T.some((t) => t.gate); this.hasBuddy = L.buddy >= 0;
    this.schedLen = L.sched.reduce((a, s) => a + s.moves, 0);
    this.phaseAt = []; for (const s of L.sched) for (let k = 0; k < s.moves; k++) this.phaseAt.push(s.ph);
    this.period = L.clouds.reduce((acc, c) => { const len = c.dx ? w + c.w : h + c.h; return (acc / gcd(acc, len)) * len; }, this.schedLen);
    this.shade = {}; this.gateShade = {};
    for (const ph of ["R", "Z", "S"]) {
      const s = new Array(n).fill(false), gs = new Array(n).fill(false), P = PHASES[ph];
      for (let i = 0; i < n; i++) {
        const len = shadowLen(ph, this.T[i].h); if (!len) continue;
        const target = this.T[i].gate ? gs : s;
        let x = i % w, y = (i / w) | 0;
        for (let k = 1; k <= len; k++) { x += P.dx; y += P.dy; if (x < 0 || y < 0 || x >= w || y >= h) break; target[y * w + x] = true; }
      }
      this.shade[ph] = s; this.gateShade[ph] = gs;
    }
    this.heat = new Array(n).fill(false);
    for (let i = 0; i < n; i++) if (this.T[i].grill) { this.heat[i] = true; for (const j of this.nb(i)) this.heat[j] = true; }
    this.cloudShade = null;
    if (L.clouds.length) {
      this.cloudShade = [];
      for (let t = 0; t < this.period; t++) { const s = new Array(n).fill(false); for (const c of L.clouds) for (const j of this.cloudCells(c, t)) s[j] = true; this.cloudShade.push(s); }
    }
  }
  initial() { return { pos: this.L.start, time: 0, crates: this.L.crates.slice().sort((a, b) => a - b), mask: this.allMask, buddy: this.L.buddy, open: this.L.gatesOpen }; }
  nb(i) { const w = this.w, x = i % w, y = (i / w) | 0, o = []; if (x > 0) o.push(i - 1); if (x < w - 1) o.push(i + 1); if (y > 0) o.push(i - w); if (y < this.h - 1) o.push(i + w); return o; }

  movesLeft(t) { let r = mod(t, this.schedLen); for (const s of this.L.sched) { if (r < s.moves) return s.moves - r; r -= s.moves; } return 1; }
  cloudOffset(c, t) { return c.dx ? mod(c.x + c.w + c.dx * t, this.w + c.w) - c.w : mod(c.y + c.h + c.dy * t, this.h + c.h) - c.h; }
  cloudCells(c, t) {
    const o = [], off = this.cloudOffset(c, t);
    if (c.dx) { for (let y = c.y; y < c.y + c.h; y++) for (let x = off; x < off + c.w; x++) if (x >= 0 && x < this.w && y >= 0 && y < this.h) o.push(y * this.w + x); }
    else { for (let y = off; y < off + c.h; y++) for (let x = c.x; x < c.x + c.w; x++) if (x >= 0 && x < this.w && y >= 0 && y < this.h) o.push(y * this.w + x); }
    return o;
  }
  /** Gates are open if switched open, or held open by someone standing in a gate. */
  gatesOpen(open, pos, buddy) { return !this.hasGates || open || !!this.T[pos].gate || (buddy >= 0 && !!this.T[buddy].gate); }
  enterable(c, open) { return this.T[c].walk || (open && this.T[c].gate); }
  shadeNoHeat(t, i, crates, buddy, open) {
    if (this.T[i].always) return true;
    const ph = this.phase(t), P = PHASES[ph];
    if (P.night) return true;
    if (this.shade[ph][i]) return true;
    if (!open && this.gateShade[ph][i]) return true;
    if (this.cloudShade && this.cloudShade[mod(t, this.period)][i]) return true;
    const cx = (i % this.w) - P.dx, cy = ((i / this.w) | 0) - P.dy;
    if (cx < 0 || cy < 0 || cx >= this.w || cy >= this.h) return false;
    const caster = cy * this.w + cx;
    return caster === buddy || crates.includes(caster);
  }
  isSafe(t, i, crates, buddy, open) { return !this.heat[i] && this.shadeNoHeat(t, i, crates, buddy, open); }
  safeState(t, s) { return this.isSafe(t, s.pos, s.crates, s.buddy, this.gatesOpen(s.open, s.pos, s.buddy)); }
  step(s, d) {
    const [dx, dy] = DIRS[d], w = this.w, h = this.h;
    let crates = s.crates.slice(), mask = s.mask, p = s.pos, path = [], pushFrom = -1, pushTo = -1, open = s.open, buddy = s.buddy, teleportAt = -1, slid = 0, blown = 0;
    const collect = (c) => { const f = this.flakeAt[c]; if (f >= 0) mask &= ~(1 << f); if (this.T[c].sw) open = !open; };
    if (d !== "W") {
      const nx = (p % w) + dx, ny = ((p / w) | 0) + dy;
      if (nx < 0 || ny < 0 || nx >= w || ny >= h) return { res: "blocked", pos: -1 };
      const tg = ny * w + nx;
      if (!this.enterable(tg, this.gatesOpen(open, p, buddy))) return { res: "blocked", pos: tg };
      const ci = crates.indexOf(tg);
      if (ci >= 0) {
        const bx = nx + dx, by = ny + dy;
        if (bx < 0 || by < 0 || bx >= w || by >= h) return { res: "blocked", pos: tg };
        const b = by * w + bx, f = this.flakeAt[b];
        if (!this.T[b].crate || b === buddy || crates.includes(b) || (f >= 0 && mask & (1 << f))) return { res: "blocked", pos: tg };
        crates[ci] = b; crates.sort((a, c) => a - c); pushFrom = tg; pushTo = b;
      }
      p = tg; path.push(p); collect(p);
      let mdx = dx, mdy = dy, guard = 0;
      while (guard++ < 2 * this.n) {
        const partner = this.partner[p];
        if (partner >= 0 && teleportAt !== path.length - 1) {
          if (crates.includes(partner)) break;
          p = partner; teleportAt = path.length; path.push(p); collect(p); continue;
        }
        if (partner >= 0) break;
        const T = this.T[p]; let ddx, ddy;
        if (T.wind) [ddx, ddy] = T.wind; else if (T.ice) { ddx = mdx; ddy = mdy; } else break;
        const sx = (p % w) + ddx, sy = ((p / w) | 0) + ddy;
        if (sx < 0 || sy < 0 || sx >= w || sy >= h) break;
        const q = sy * w + sx;
        if (!this.enterable(q, this.gatesOpen(open, p, buddy)) || crates.includes(q)) break;
        if (T.wind) blown++; else slid++;
        mdx = ddx; mdy = ddy; p = q; path.push(p); collect(p);
      }
      if (this.hasBuddy && p !== s.pos) buddy = path.length >= 2 ? path[path.length - 2] : s.pos;
    }
    const ok = this.isSafe(s.time + 1, p, crates, buddy, this.gatesOpen(open, p, buddy));
    return { res: ok ? "ok" : "hot", pos: p, crates, mask, path, pushFrom, pushTo, open, buddy, teleportAt, slid, blown };
  }
  trapped(s) { return s.pos !== this.igloo && !"UDLRW".split("").some((d) => this.step(s, d).res === "ok"); }
  solve(s, needAll, limit = 300000) {
    const key = (st) => `${st.pos},${mod(st.time, this.period)},${st.mask},${st.buddy},${st.open ? 1 : 0},${st.crates.join(".")}`;
    const start = { pos: s.pos, time: mod(s.time, this.period), mask: s.mask, crates: s.crates.slice(), buddy: s.buddy, open: s.open };
    const seen = new Map([[key(start), null]]);
    let frontier = [start];
    while (frontier.length) {
      const nextF = [];
      for (const st of frontier) {
        if (st.pos === this.igloo) { if (!needAll || st.mask === 0) { const out = []; let k = key(st); while (seen.get(k)) { const e = seen.get(k); out.push(e.d); k = e.k; } return out.reverse(); } continue; }
        const k0 = key(st);
        for (const d of "UDLRW") {
          const r = this.step(st, d); if (r.res !== "ok") continue;
          const ns = { pos: r.pos, time: mod(st.time + 1, this.period), mask: r.mask, crates: r.crates, buddy: r.buddy, open: r.open };
          const nk = key(ns);
          if (seen.has(nk)) continue;
          seen.set(nk, { k: k0, d }); nextF.push(ns);
          if (seen.size > limit) return null;
        }
      }
      frontier = nextF;
    }
    return null;
  }
}

// ================================================================ start
function start() {
  const last = store.get("last", null);
  const ok = last && (last.daily || (WORLDS[last.w - 1] && WORLDS[last.w - 1][last.i - 1]));
  load(ok ? (last.daily ? { daily: true, day: today } : last) : { w: 1, i: 1 });

  showTitle(true);
  requestAnimationFrame(frame);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start();

// demo: only the first levels; after the last one the page takes over again
const showWinFull = showWin;
showWin = function () {
