<script>/* Schachpartie als Link teilen – ohne Server: alles steckt im Link hinter dem „#“.
 * https://denkarena.com/p#<Code>  (die App öffnet den Link direkt, sonst zeigt die Webseite die Partie)
 * Ältere Links auf https://denkarena.github.io/p#… funktionieren weiter (dieselbe Seite liegt auf beiden Adressen).
 * Der Code ist base64url und enthält: Namen, Ergebnis, Grund, Art der Partie (online / Computer-Stufe / zu zweit),
 * Bedenkzeit, Datum, optional Wertungen und alle Züge (2 Byte pro Zug). Wird auch von site/p.html benutzt.
 * Format NIE ändern, sondern nur über die Versionsnummer erweitern – geteilte Links sollen dauerhaft funktionieren. */
(function (root) {
  'use strict';
  const BASE = 'https://denkarena.com/p';
  const VERSION = 1;
  // Reihenfolge ist Teil des Formats: nur hinten anhängen
  const REASONS = ['', 'Schachmatt', 'Patt', 'Dreifache Wiederholung', '50-Züge-Regel', 'Zu wenig Material', 'Aufgabe', 'Zeit abgelaufen', 'Verbindung verloren', 'Remis vereinbart'];
  const CLOCKS = ['none', '1', '3', '3+2', '5', '10', '15+10', '30', '2+1', '5+3', '10+5'];
  const MODES = ['online', 'solo', 'pvp'];
  const PROMO = ['', 'q', 'r', 'b', 'n'];
  const RESULTS = ['', 'w', 'b', 'draw'];
  const DAY0 = Date.UTC(2024, 0, 1);
  const MAX_NAME = 32, MAX_MOVES = 600;

  const sq = s => (s.charCodeAt(0) - 97) + 8 * (8 - +s[1]);           // a8 = 0 … h1 = 63
  const sqName = i => 'abcdefgh'[i % 8] + (8 - Math.floor(i / 8));
  const utf8 = s => new TextEncoder().encode(String(s || ''));
  const cut = (bytes, n) => { if (bytes.length <= n) return bytes; let k = n; while (k > 0 && (bytes[k] & 0xc0) === 0x80) k--; return bytes.slice(0, k); };

  const unb64 = str => { const s = atob(str.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((str.length + 3) % 4)); const out = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i); return out; };

  // g = { names: { w, b }, result: 'w'|'b'|'draw'|'', reason, mode: 'online'|'solo'|'pvp', level (0…), clock, date (ms),
  //       ratings: { w, b } (optional), moves: ['e2e4', …] }
  function encode(g) {
    const out = [];
    const ratings = g.ratings && g.ratings.w && g.ratings.b ? g.ratings : null;
    const res = Math.max(0, RESULTS.indexOf(g.result || '')), mode = Math.max(0, MODES.indexOf(g.mode || 'pvp'));
    out.push(VERSION, res | (mode << 2) | (ratings ? 16 : 0), Math.max(0, REASONS.indexOf(g.reason || '')), Math.max(0, CLOCKS.indexOf(g.clock || 'none')), Math.max(0, Math.min(255, g.level | 0)));
    const day = Math.max(0, Math.min(65535, Math.floor(((g.date || Date.now()) - DAY0) / 86400000)));
    out.push(day >> 8, day & 255);
    for (const c of ['w', 'b']) { const n = cut(utf8(g.names && g.names[c]), MAX_NAME); out.push(n.length, ...n); }
    if (ratings) for (const c of ['w', 'b']) { const r = Math.max(0, Math.min(65535, Math.round(ratings[c]))); out.push(r >> 8, r & 255); }
    for (const u of (g.moves || []).slice(0, MAX_MOVES)) {
      const v = (sq(u.slice(0, 2)) << 9) | (sq(u.slice(2, 4)) << 3) | Math.max(0, PROMO.indexOf(u[4] || ''));
      out.push(v >> 8, v & 255);
    }
    return b64(Uint8Array.from(out));
  }

  function decode(code) {
    try {
      const b = unb64(String(code || '').trim());
      if (b.length < 9 || b[0] !== VERSION) return null;
      let i = 1;
      const flags = b[i++], reason = REASONS[b[i++]] || '', clock = CLOCKS[b[i++]] || 'none', level = b[i++];
      const day = (b[i++] << 8) | b[i++];
      const td = new TextDecoder(), names = {};
      for (const c of ['w', 'b']) { const n = b[i++]; if (n > MAX_NAME || i + n > b.length) return null; names[c] = td.decode(b.slice(i, i + n)); i += n; }
      let ratings = null;
      if (flags & 16) { ratings = {}; for (const c of ['w', 'b']) { ratings[c] = (b[i++] << 8) | b[i++]; } }
      if ((b.length - i) % 2) return null;
      const moves = [];
      for (; i + 1 < b.length; i += 2) {
        const v = (b[i] << 8) | b[i + 1], f = v >> 9, t = (v >> 3) & 63, p = PROMO[v & 7];
        if (p === undefined || f === t) return null;
        moves.push(sqName(f) + sqName(t) + p);
      }
      return { names, result: RESULTS[flags & 3], mode: MODES[(flags >> 2) & 3] || 'pvp', reason, clock, level, date: DAY0 + day * 86400000, ratings, moves };
    } catch (e) { return null; }
  }

  // Code aus einem geteilten Link (https://…/p#CODE, denkarena://p?g=CODE) oder direkt eingefügtem Code holen
  function fromUrl(url) {
    const s = String(url || '').trim();
    let m = s.match(/[#&?]g=([A-Za-z0-9_-]+)/) || s.match(/\/p(?:\.html)?\/?#([A-Za-z0-9_-]+)/) || s.match(/^([A-Za-z0-9_-]{12,})$/);
    return m ? m[1] : null;
  }

  root.GameLink = { encode, decode, fromUrl, url: code => BASE + '#' + code, BASE, REASONS, CLOCKS };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

  if (!g) { app.innerHTML = `<p class="err">${t.bad}</p><div class="cta"><a class="btn primary" href="${PLAY}">${t.store}</a></div>`; return; }

  // Stellungen nachspielen (ohne Regelprüfung: die Züge stammen aus einer gültigen Partie)
  const start = 'rnbqkbnrpppppppp' + '.'.repeat(32) + 'PPPPPPPPRNBQKBNR';
  const sq = s => (s.charCodeAt(0) - 97) + 8 * (8 - +s[1]);
  const pos = [start.split('')], san = [], last = [null];
  for (const u of g.moves) {
    const b = pos[pos.length - 1].slice(), fr = sq(u.slice(0, 2)), to = sq(u.slice(2, 4)), p = b[fr];
    if (p === '.') break;
    const white = p === p.toUpperCase(), P = p.toUpperCase(), cap = b[to] !== '.';
    let s;
    if (P === 'K' && Math.abs((to % 8) - (fr % 8)) === 2) {
      const ks = to % 8 === 6, rf = ks ? to + 1 : to - 2, rt = ks ? to - 1 : to + 1;
      b[rt] = b[rf]; b[rf] = '.'; s = ks ? 'O-O' : 'O-O-O';
    }
    let ep = false;
    if (P === 'P' && (to % 8) !== (fr % 8) && !cap) { b[to + (white ? 8 : -8)] = '.'; ep = true; }
    b[to] = u[4] ? (white ? u[4].toUpperCase() : u[4]) : p; b[fr] = '.';
    const DE = { K: 'K', Q: 'D', R: 'T', B: 'L', N: 'S' };
    if (!s) s = (P === 'P' ? (cap || ep ? u[0] + 'x' : '') : DE[P] + (cap ? 'x' : '')) + u.slice(2, 4) + (u[4] ? '=' + DE[u[4].toUpperCase()] : '');
    pos.push(b); san.push(s); last.push([fr, to]);
  }
  if (g.reason === 'Schachmatt' && san.length === g.moves.length && san.length) san[san.length - 1] += '#';
  // in anderen Sprachen englische Figurenbuchstaben
  if (L !== 'de') for (let i = 0; i < san.length; i++) san[i] = san[i].replace(/^[DTLS]/, c => ({ D: 'Q', T: 'R', L: 'B', S: 'N' })[c]).replace(/=([DTLS])/, (_, c) => '=' + ({ D: 'Q', T: 'R', L: 'B', S: 'N' })[c]);

  const nm = c => g.names[c] || (g.mode === 'solo' ? f(t.computer, { n: g.level + 1 }) : c === 'w' ? t.white : t.black);
  const flip = g.mode === 'solo' && !g.names.w && !!g.names.b;
  const res = g.result === 'draw' ? t.draw : g.result ? f(t.win, { n: nm(g.result) }) : t.open;
  const reason = g.reason ? (t.r[g.reason] || g.reason) : '';
  const clock = g.clock && g.clock !== 'none' ? f(t.min, { n: g.clock.replace('+', ' + ') }) : '';
  const date = new Date(g.date).toLocaleDateString(L, { day: 'numeric', month: 'long', year: 'numeric' });
  document.title = `${nm('w')} ${t.vs} ${nm('b')} – ${t.title} – DenkArena`;
  document.getElementById('kind').textContent = t[g.mode] || '';
  const bar = c => `<div class="bar ${g.result === c ? 'win' : ''}"><span class="dot ${c}"></span><b>${esc(nm(c))}</b>${g.ratings ? `<small>${g.ratings[c]}</small>` : ''}</div>`;
  const intent = `intent://p?g=${code}#Intent;scheme=denkarena;package=io.github.denkarena;S.browser_fallback_url=${encodeURIComponent(PLAY)};end`;
  app.innerHTML = `${bar(flip ? 'w' : 'b')}<div class="board" id="board"></div>${bar(flip ? 'b' : 'w')}
    <div class="ctrl"><button data-k="first" aria-label="|‹">⏮</button><button data-k="prev" aria-label="‹">◀</button><button data-k="next" aria-label="›">▶</button><button data-k="last" aria-label="›|">⏭</button></div>
    <div class="now" id="now"></div><div class="moves" id="moves"></div>
    <div class="res"><h1>${esc(res)}</h1><p>${[reason, clock, f(t.moves, { n: Math.ceil(san.length / 2) }), date].filter(Boolean).map(esc).join(' · ')}</p></div>
    <div class="cta"><a class="btn primary" href="${/android/i.test(navigator.userAgent) ? intent : PLAY}">${t.app}</a><a class="btn" href="${PLAY}">${t.store}</a></div>
    <p class="note">${t.note}</p>`;
  const G = { K: '♚', Q: '♛', R: '♜', B: '♝', N: '♞', P: '♟' };
  const boardEl = document.getElementById('board'), nowEl = document.getElementById('now'), movesEl = document.getElementById('moves');
  movesEl.innerHTML = san.map((s, i) => (i % 2 ? '' : `<i>${i / 2 + 1}.</i>`) + `<em data-i="${i + 1}">${esc(s)}</em>`).join('');
  let idx = san.length;
  function draw() {
    const b = pos[idx], lm = last[idx] || [];
    let h = '';
    for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
      const i = flip ? 63 - (y * 8 + x) : y * 8 + x, p = b[i], dark = ((i % 8) + Math.floor(i / 8)) % 2 === 1;
      const coR = x === 0 ? `<span class="co r">${8 - Math.floor(i / 8)}</span>` : '', coF = y === 7 ? `<span class="co f">${'abcdefgh'[i % 8]}</span>` : '';
      h += `<div class="sq ${dark ? 'd' : ''} ${lm.includes(i) ? 'hl' : ''}">${coR}${coF}${p !== '.' ? `<span class="${p === p.toUpperCase() ? 'pw' : 'pb'}">${G[p.toUpperCase()]}&#xFE0E;</span>` : ''}</div>`;
    }
    boardEl.innerHTML = h;
    nowEl.textContent = idx ? `${Math.floor((idx - 1) / 2) + 1}${idx % 2 ? '.' : '…'} ${san[idx - 1]}` : t.start;
    movesEl.querySelectorAll('em').forEach(e => e.classList.toggle('on', +e.dataset.i === idx));
    const on = movesEl.querySelector('em.on'); if (on) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    app.querySelector('[data-k=first]').disabled = app.querySelector('[data-k=prev]').disabled = idx === 0;
    app.querySelector('[data-k=next]').disabled = app.querySelector('[data-k=last]').disabled = idx === san.length;
  }
  const go = i => { idx = Math.max(0, Math.min(san.length, i)); draw(); };
  app.querySelector('.ctrl').onclick = e => { const k = e.target.closest('button'); if (!k) return; const a = k.dataset.k; go(a === 'first' ? 0 : a === 'prev' ? idx - 1 : a === 'next' ? idx + 1 : san.length); };
  movesEl.onclick = e => { const m = e.target.closest('em'); if (m) go(+m.dataset.i); };
  document.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') go(idx - 1); else if (e.key === 'ArrowRight') go(idx + 1); });
  let sx = null;
  boardEl.addEventListener('pointerdown', e => { sx = e.clientX; });
  boardEl.addEventListener('pointerup', e => { if (sx == null) return; const dx = e.clientX - sx; sx = null; if (Math.abs(dx) > 30) go(idx + (dx < 0 ? 1 : -1)); else go(idx + 1); });
  draw();
})();
</script>
</body></html>
