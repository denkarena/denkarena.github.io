:root{--bg:#0f1513;--card:#18211e;--card2:#1f2a26;--text:#ece5d5;--muted:#a3aba4;--brass:#c9a45c;--brass-hi:#e6cf96;--brass-lo:#8a6d33;--line:rgba(232,220,192,.14);--light:#e9e2cf;--dark:#5f7c66;--hl:rgba(214,178,96,.42)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font:400 24px Georgia,serif;color:var(--text);text-decoration:none}.brand b{color:var(--brass-hi);font-weight:400}
.kind{color:var(--muted);font-size:13px;text-align:right}
.bar{display:flex;align-items:center;gap:10px;padding:8px 2px}
.dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1.5px var(--brass-lo)}.dot.w{background:#f3ecd9}.dot.b{background:#1b1f1d}
.bar b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar small{color:var(--muted);margin-left:auto;flex:none}
.bar.win b{color:var(--brass-hi)}
.board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);aspect-ratio:1;width:100%;max-width:100%;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--line);touch-action:pan-y;user-select:none;container-type:inline-size}
.sq{position:relative;display:grid;place-items:center;min-width:0;min-height:0;overflow:hidden;background:var(--light);line-height:1}
.sq.d{background:var(--dark)}.sq.hl::after{content:"";position:absolute;inset:0;background:var(--hl)}
/* Figuren wie in der App (Satz „Turnier“): eigene Schrift, Verlauf und Umriss */
.sq span.pw,.sq span.pb{position:relative;z-index:1;font-family:"DA Chess","Noto Sans Symbols 2","Segoe UI Symbol",serif;font-size:11.6cqw;line-height:1;display:inline-block;-webkit-background-clip:text;background-clip:text;color:transparent}
.pw{background-image:linear-gradient(175deg,#fffdf7 25%,#e7dfcc 65%,#c2b597);-webkit-text-stroke:.3cqw #2a241b;filter:drop-shadow(0 .5cqw .45cqw rgba(0,0,0,.45))}.pb{background-image:linear-gradient(175deg,#57504a 0%,#2a2522 45%,#0d0b0a);-webkit-text-stroke:.26cqw rgba(236,229,213,.6);filter:drop-shadow(0 .5cqw .45cqw rgba(0,0,0,.55))}
.co{position:absolute;font-size:10px;font-weight:700;opacity:.7}.co.r{left:3px;top:2px}.co.f{right:3px;bottom:1px}.sq .co{color:var(--dark)}.sq.d .co{color:var(--light)}
.ctrl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 6px}
button,.btn{font:inherit;border:0;cursor:pointer;border-radius:12px;padding:12px 10px;background:var(--card2);color:var(--text);font-weight:600;text-align:center;text-decoration:none;display:block}
button:disabled{opacity:.35;cursor:default}
.now{text-align:center;color:var(--muted);font-size:14px;min-height:22px}
.moves{display:flex;flex-wrap:wrap;gap:2px 8px;max-height:132px;overflow:auto;padding:10px 12px;margin-top:8px;background:var(--card);border-radius:12px;font-size:14px;font-variant-numeric:tabular-nums}

<script>/* Schachpartie als Link teilen – ohne Server: alles steckt im Link hinter dem „#“.
 * https://denkarena.com/p#<Code>  (die App öffnet den Link direkt, sonst zeigt die Webseite die Partie)
 * Ältere Links auf https://denkarena.github.io/p#… funktionieren weiter (dieselbe Seite liegt auf beiden Adressen).
 * Der Code ist base64url und enthält: Namen, Ergebnis, Grund, Art der Partie (online / Computer-Stufe / zu zweit),
 * Bedenkzeit, Datum, optional Wertungen und alle Züge (2 Byte pro Zug). Wird auch von site/p.html benutzt.
 * Format NIE ändern, sondern nur über die Versionsnummer erweitern – geteilte Links sollen dauerhaft funktionieren. */
(function (root) {
  'use strict';
  const BASE = 'https://denkarena.com/p';
  const VERSION = 1;
  // Reihenfolge ist Teil des Formats: nur hinten anhängen
  const REASONS = ['', 'Schachmatt', 'Patt', 'Dreifache Wiederholung', '50-Züge-Regel', 'Zu wenig Material', 'Aufgabe', 'Zeit abgelaufen', 'Verbindung verloren', 'Remis vereinbart'];
  const CLOCKS = ['none', '1', '3', '3+2', '5', '10', '15+10', '30'];
  const MODES = ['online', 'solo', 'pvp'];
  const PROMO = ['', 'q', 'r', 'b', 'n'];
  const RESULTS = ['', 'w', 'b', 'draw'];
  const DAY0 = Date.UTC(2024, 0, 1);
  const MAX_NAME = 32, MAX_MOVES = 600;

  const sq = s => (s.charCodeAt(0) - 97) + 8 * (8 - +s[1]);           // a8 = 0 … h1 = 63
  const sqName = i => 'abcdefgh'[i % 8] + (8 - Math.floor(i / 8));
  const utf8 = s => new TextEncoder().encode(String(s || ''));
  const cut = (bytes, n) => { if (bytes.length <= n) return bytes; let k = n; while (k > 0 && (bytes[k] & 0xc0) === 0x80) k--; return bytes.slice(0, k); };
  const b64 = bytes => { let s = ''; bytes.forEach(b => (s += String.fromCharCode(b))); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
  const unb64 = str => { const s = atob(str.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((str.length + 3) % 4)); const out = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i); return out; };

  // g = { names: { w, b }, result: 'w'|'b'|'draw'|'', reason, mode: 'online'|'solo'|'pvp', level (0…), clock, date (ms),
  //       ratings: { w, b } (optional), moves: ['e2e4', …] }
  function encode(g) {
    const out = [];
    const ratings = g.ratings && g.ratings.w && g.ratings.b ? g.ratings : null;
    const res = Math.max(0, RESULTS.indexOf(g.result || '')), mode = Math.max(0, MODES.indexOf(g.mode || 'pvp'));
    out.push(VERSION, res | (mode << 2) | (ratings ? 16 : 0), Math.max(0, REASONS.indexOf(g.reason || '')), Math.max(0, CLOCKS.indexOf(g.clock || 'none')), Math.max(0, Math.min(255, g.level | 0)));
    const day = Math.max(0, Math.min(65535, Math.floor(((g.date || Date.now()) - DAY0) / 86400000)));
    out.push(day >> 8, day & 255);
    for (const c of ['w', 'b']) { const n = cut(utf8(g.names && g.names[c]), MAX_NAME); out.push(n.length, ...n); }
    if (ratings) for (const c of ['w', 'b']) { const r = Math.max(0, Math.min(65535, Math.round(ratings[c]))); out.push(r >> 8, r & 255); }
    for (const u of (g.moves || []).slice(0, MAX_MOVES)) {
      const v = (sq(u.slice(0, 2)) << 9) | (sq(u.slice(2, 4)) << 3) | Math.max(0, PROMO.indexOf(u[4] || ''));
      out.push(v >> 8, v & 255);
    }
    return b64(Uint8Array.from(out));
  }

  function decode(code) {
    try {
      const b = unb64(String(code || '').trim());
      if (b.length < 9 || b[0] !== VERSION) return null;
      let i = 1;
      const flags = b[i++], reason = REASONS[b[i++]] || '', clock = CLOCKS[b[i++]] || 'none', level = b[i++];
      const day = (b[i++] << 8) | b[i++];
      const td = new TextDecoder(), names = {};
      for (const c of ['w', 'b']) { const n = b[i++]; if (n > MAX_NAME || i + n > b.length) return null; names[c] = td.decode(b.slice(i, i + n)); i += n; }
      let ratings = null;
      if (flags & 16) { ratings = {}; for (const c of ['w', 'b']) { ratings[c] = (b[i++] << 8) | b[i++]; } }
      if ((b.length - i) % 2) return null;
      const moves = [];
      for (; i + 1 < b.length; i += 2) {
        const v = (b[i] << 8) | b[i + 1], f = v >> 9, t = (v >> 3) & 63, p = PROMO[v & 7];
        if (p === undefined || f === t) return null;
        moves.push(sqName(f) + sqName(t) + p);
      }
      return { names, result: RESULTS[flags & 3], mode: MODES[(flags >> 2) & 3] || 'pvp', reason, clock, level, date: DAY0 + day * 86400000, ratings, moves };
    } catch (e) { return null; }
  }

  // Code aus einem geteilten Link (https://…/p#CODE, denkarena://p?g=CODE) oder direkt eingefügtem Code holen
  function fromUrl(url) {
    const s = String(url || '').trim();
    let m = s.match(/[#&?]g=([A-Za-z0-9_-]+)/) || s.match(/\/p(?:\.html)?\/?#([A-Za-z0-9_-]+)/) || s.match(/^([A-Za-z0-9_-]{12,})$/);
    return m ? m[1] : null;
  }

  root.GameLink = { encode, decode, fromUrl, url: code => BASE + '#' + code, BASE, REASONS, CLOCKS };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

    pl: { white: 'Białe', black: 'Czarne', vs: 'vs', win: 'Wygrywa {n}', draw: 'Remis', open: 'Niezakończona', computer: 'Komputer · Poziom {n}', player: 'Gracz', online: 'Partia online', solo: 'Z komputerem', pvp: 'Partia we dwoje', moves: 'Ruchy: {n}', start: 'Pozycja początkowa', app: 'Otwórz w DenkArena', store: 'Pobierz DenkArena z Google Play', note: 'W aplikacji możesz przeanalizować partię z objaśnieniami i grać dalej od dowolnej pozycji.', bad: 'Ten link jest nieprawidłowy lub niepełny.', title: 'Partia szachów', none: 'bez zegara', min: '{n} min',

  };
  const t = D[L] || D.en, f = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);
